# Builds the Android app and the Chrome extension on every push.
#
#   main          → a GitHub Release "v<VERSION>.<run number>" with both attached
#   other branches → the same files as workflow artifacts (kept 90 days)
#
# The version is VERSION (major.minor, bumped by hand) plus github.run_number,
# so every build has its own number and past builds stay on the Releases page.

name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a main build: each one is a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" != "pull_request" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  extension:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the prompt copies match shared/system-prompt.md
        run: scripts/sync_prompt.sh --check

      - name: Unit tests
        working-directory: chrome-extension
        run: TZ=UTC node --test test/*.test.js

      - name: Stamp the version and zip
        run: |
          mkdir -p dist/extension
          cp -r chrome-extension/. dist/extension/
          rm -rf dist/extension/test dist/extension/package.json

          node -e '
            const fs = require("fs");
            const path = "dist/extension/manifest.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.version = process.env.VERSION;
            manifest.version_name = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(manifest, null, "\t") + "\n");
          '

          (cd dist/extension && zip -qr "../read-deeper-extension-${VERSION}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: read-deeper-extension-${{ env.VERSION }}
          path: dist/read-deeper-extension-${{ env.VERSION }}.zip

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The same key must sign every build, or Android won't install an update
      # over the previous one. See scripts/make_keystore.sh.
      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$RELEASE" == "true" ]]; then
            echo "::error::No signing key. Run scripts/make_keystore.sh and add the ANDROID_* repository secrets before releasing."
            exit 1
          else
            echo "::warning::No signing key in secrets; this branch build is debug-signed and won't update an installed release build."
          fi

      - name: Unit tests and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/read-deeper-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: read-deeper-${{ env.VERSION }}.apk
          path: dist/read-deeper-${{ env.VERSION }}.apk

  release:
    needs: [version, extension, android]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Read Deeper ${VERSION}" \
            --generate-notes
